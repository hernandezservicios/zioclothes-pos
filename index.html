<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZIO CLOTHES - Punto de Venta</title>
    <meta name="description" content="Sistema de Punto de Venta para ZIO CLOTHES - Gestión de ventas, inventario, créditos y más." />
    <meta name="theme-color" content="#2F2A25" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZIO CLOTHES" />
    <meta name="application-name" content="ZIO CLOTHES POS" />
    <!-- AUDITORÍA (FASE -- responsive completo, "Manifest: Syntax error"
         en consola): este <link> manual duplicaba el que
         `vite-plugin-pwa` YA inyecta automáticamente (confirmado en el
         build real: dist/index.html trae ambos, apuntando al mismo
         /shop/manifest.webmanifest). En `npm run dev`, el propio
         middleware de Vite reescribe cualquier href absoluto ("/...")
         para anteponerle `base` -- pero como este ya traía "/shop/"
         escrito a mano, terminaba pidiendo "/shop/shop/manifest.
         webmanifest" (confirmado con curl contra el dev server real),
         que no existe y cae al fallback HTML de la SPA -- de ahí el
         error de sintaxis al intentar parsearlo como JSON. En
         producción (`npm run build` + `npm run preview`, verificado con
         curl: content-type application/manifest+json, JSON válido) el
         manifest real sigue funcionando exactamente igual porque lo
         sirve el <link> que ya inyecta el plugin -- quitar este
         duplicado manual no cambia nada en producción, solo evita el
         intento de request roto en desarrollo. -->
    <link rel="icon" type="image/svg+xml" href="/shop/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/shop/icons/icon-192.svg" />
    <meta property="og:title" content="ZIO CLOTHES - Punto de Venta" />
    <meta property="og:description" content="Sistema de Punto de Venta para ZIO CLOTHES" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
